name: Daily Horizon Summary
run-name: Daily Horizon Summary (${{ github.event_name == 'schedule' && 'scheduled' || inputs.run_mode }})

on:
  schedule:
    # GitHub cron uses UTC. 01:15 UTC = 09:15 Asia/Shanghai.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "运行完整日报、飞书连通性测试，或仅检查平台变化来源"
        required: true
        default: full
        type: choice
        options:
          - full
          - webhook_test
          - platform_changes_smoke

concurrency:
  group: horizon-daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read  # Needed to detect a successful fallback run from the same Beijing date
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for an earlier successful daily run
        id: daily_run_gate
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_daily_run_gate.py

      - name: Report duplicate daily skip
        if: github.event_name == 'schedule' && steps.daily_run_gate.outputs.should_run == 'false'
        run: echo "A successful daily run already exists for this Beijing date; skipping delayed schedule."

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true'
        run: uv sync

      - name: Prepare GitHub Actions config
        if: github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true'
        run: cp data/config.github.json data/config.json

      - name: Restore platform change state
        id: restore_platform_change_state
        if: (github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true') && (github.event_name == 'schedule' || inputs.run_mode == 'full')
        uses: actions/cache/restore@v4
        with:
          path: data/platform_change_state.json
          key: platform-change-state-${{ github.run_id }}
          restore-keys: |
            platform-change-state-

      - name: Report restored platform change cache key
        if: steps.restore_platform_change_state.outcome == 'success'
        run: echo "cache-matched-key=${{ steps.restore_platform_change_state.outputs.cache-matched-key }}"

      - name: Restore production platform change state for smoke
        id: restore_platform_change_state_smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'platform_changes_smoke'
        uses: actions/cache/restore@v4
        with:
          path: data/platform_change_state.json
          key: platform-change-state-smoke-${{ github.run_id }}
          restore-keys: |
            platform-change-state-
          fail-on-cache-miss: true

      - name: Report restored smoke cache key
        if: steps.restore_platform_change_state_smoke.outcome == 'success'
        run: echo "cache-matched-key=${{ steps.restore_platform_change_state_smoke.outputs.cache-matched-key }}"

      - name: Run Horizon
        if: (github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true') && (github.event_name == 'schedule' || inputs.run_mode == 'full')
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ALAPI_TOKEN: ${{ secrets.ALAPI_TOKEN }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          HORIZON_WEBHOOK_NOT_BEFORE_LOCAL: "10:00"
          HORIZON_WEBHOOK_TIMEZONE: "Asia/Shanghai"
        run: uv run horizon --hours 24

      - name: Save platform change state
        if: success() && (github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true') && (github.event_name == 'schedule' || inputs.run_mode == 'full') && hashFiles('data/platform_change_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/platform_change_state.json
          key: platform-change-state-${{ github.run_id }}

      - name: Run platform changes smoke
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'platform_changes_smoke'
        run: uv run horizon-platform-changes-smoke --config data/config.json --require-state

      - name: Send webhook connectivity test
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'webhook_test'
        env:
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon-webhook --config data/config.github.json --lang zh

      - name: Upload selection diagnostics
        if: always() && (github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true') && (github.event_name == 'schedule' || inputs.run_mode == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: horizon-selection-diagnostics-${{ github.run_id }}
          path: data/diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Set current date as environment variable
        if: (github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true') && (github.event_name == 'schedule' || inputs.run_mode == 'full')
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        if: (github.event_name != 'schedule' || steps.daily_run_gate.outputs.should_run == 'true') && (github.event_name == 'schedule' || inputs.run_mode == 'full')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
