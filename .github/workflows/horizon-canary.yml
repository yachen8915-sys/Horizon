name: Horizon Feishu Canary
run-name: Horizon Feishu Canary (${{ github.event_name }})

on:
  schedule:
    # 23:50 UTC = 07:50 Asia/Shanghai on the next date. Start early so the card can arrive by 09:00.
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose a cheap webhook check or the full canary pipeline"
        required: true
        default: webhook_test
        type: choice
        options:
          - webhook_test
          - full

concurrency:
  group: horizon-feishu-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Gate the one-day canary
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_DATE: "2026-09-05"
        run: |
          today="$(TZ=Asia/Shanghai date +%F)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$today" = "$TARGET_DATE" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout redesign branch
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          ref: codex/horizon-intelligence-redesign-plan-20260903

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          uv sync
          uv pip install yt-dlp

      - name: Require the isolated Feishu webhook
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          HORIZON_CANARY_WEBHOOK_URL: ${{ secrets.HORIZON_CANARY_WEBHOOK_URL }}
        run: |
          if [ -z "$HORIZON_CANARY_WEBHOOK_URL" ]; then
            echo "Missing repository secret HORIZON_CANARY_WEBHOOK_URL" >&2
            exit 1
          fi

      - name: Prepare isolated canary config
        if: steps.gate.outputs.should_run == 'true'
        run: >-
          uv run python scripts/prepare_canary_config.py
          --input data/config.github.json
          --output data/config.canary.json

      - name: Run Horizon and send only to the canary group
        if: >-
          steps.gate.outputs.should_run == 'true' &&
          (github.event_name == 'schedule' || inputs.run_mode == 'full')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ALAPI_TOKEN: ${{ secrets.ALAPI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_CANARY_WEBHOOK_URL: ${{ secrets.HORIZON_CANARY_WEBHOOK_URL }}
        shell: bash
        run: |
          set +e
          uv run horizon --config data/config.canary.json --hours 24
          first_status=$?
          set -e
          if [ "$first_status" -eq 0 ]; then
            exit 0
          fi

          checkpoint="$(find data/cache -type f -name 'horizon-analysis-*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$checkpoint" ]; then
            echo "Full canary failed before an analysis checkpoint was available." >&2
            exit "$first_status"
          fi

          echo "Full canary failed; retrying once from checkpoint: $checkpoint"
          uv run horizon --config data/config.canary.json --resume-cache "$checkpoint"

      - name: Send an isolated webhook connectivity test
        if: >-
          steps.gate.outputs.should_run == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.run_mode == 'webhook_test'
        env:
          HORIZON_CANARY_WEBHOOK_URL: ${{ secrets.HORIZON_CANARY_WEBHOOK_URL }}
        run: >-
          uv run horizon-webhook --config data/config.canary.json
          --lang zh --delivery summary

      - name: Upload canary diagnostics
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: horizon-canary-${{ github.run_id }}
          path: |
            data/canary/runs/*
            data/canary/source_health_state.json
            data/cache/*
            data/summaries/*
          if-no-files-found: warn
          retention-days: 14
